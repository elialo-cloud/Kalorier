<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kalorier – Search Test</title><style>body{font-family:system-ui;margin:24px;background:#f6f6f3;color:#181818}main{max-width:1000px;margin:auto}button{padding:10px 14px;border:0;border-radius:10px;background:#181818;color:white;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:18px;border-radius:14px;overflow:auto}.ok{color:#16803c}.bad{color:#c62828}.muted{color:#666}</style></head><body><main><h1>Kalorier · Search Test</h1><p class="muted">Detta är ett testverktyg för sökmotorn. Det testar riktiga API-svar när sidan körs på samma host som appens API.</p><button id="run">Kör tester</button><pre id="out">Tryck på Kör tester.</pre></main><script>
const tests=['ägg','agg','kokt ägg','stekt ägg','äggvita','äggula','potatis','ris','kyckling','kycklingfilé','köttfärs','nötfärs','mjölk','mjolk','bröd','brod','smör','smor','banan','äpple','ost','havregryn','coca cola zero','cola zero','jasmin ris','grekisk yoghurt','kvarg'];
const badByQuery={ägg:['potatis','ris','banan','kyckling'],agg:['potatis','ris','banan','kyckling'],potatis:['ägg','banan','kyckling'],ris:['ägg','potatis','banan'],kyckling:['ägg','potatis','banan'],banan:['ägg','potatis','kyckling'],mjölk:['ägg','potatis','kyckling'],mjolk:['ägg','potatis','kyckling']};
function norm(v){return String(v??'').toLocaleLowerCase('sv-SE').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').replace(/\s+/g,' ').trim()}
async function get(path,q){try{const r=await fetch(path+'?q='+encodeURIComponent(q));if(!r.ok)return[];const d=await r.json();return Array.isArray(d)?d:[]}catch{return[]}}
async function run(){const out=document.querySelector('#out');out.textContent='Kör…';let pass=0,fail=0,lines=[];for(const q of tests){const rows=[...(await get('/api/foods',q)),...(await get('/api/products',q))];const names=rows.map(x=>norm(x.name));const bad=(badByQuery[norm(q)]||[]).filter(x=>names.slice(0,10).some(n=>n===x||n.includes(x)));if(bad.length){fail++;lines.push('❌ '+q+'\n   Felaktiga toppträffar: '+bad.join(', ')+'\n   Topp: '+names.slice(0,5).join(' | '))}else{pass++;lines.push('✅ '+q+'\n   Topp: '+names.slice(0,5).join(' | '))}}out.textContent=`${pass}/${tests.length} tester utan upptäckta negativa träffar\n\n`+lines.join('\n\n')}
document.querySelector('#run').onclick=run;</script></body></html>
