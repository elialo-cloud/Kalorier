name: Fix app script

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove accidental markdown fences from app.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('```js\n','',1)
          s=s.replace('\n```\n\n/* =========================================================\n   ONLINE AI V4','\n\n/* =========================================================\n   ONLINE AI V4',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Fix app.js syntax fences'
          git rm .github/workflows/fix-app-fence.yml
          git commit -m 'Remove temporary fence fix workflow'
          git push