name: Rehaul search engine
on: push
permissions:
  contents: write
jobs:
  rehaul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add online AI search layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text(encoding='utf-8')
          marker = "\n/* =========================================================\n   RESTEN AV APPEN — OFÖRÄNDRAD"
          if 'ONLINE AI SEARCH LAYER V1' in s:
              raise SystemExit('already patched')
          code = r'''

/* =========================================================
   ONLINE AI SEARCH LAYER V1
   Gratis nätbaserad AI först, databasen därefter.
========================================================= */

const onlineAiCache=new Map();
let onlineAiAbort=null;
let onlineAiSequence=0;

function onlineAiJson(text){
  const raw=String(text||'').trim();
  const fenced=raw.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  const value=fenced?fenced[1]:raw;
  const start=value.indexOf('{');
  const end=value.lastIndexOf('}');
  if(start<0||end<=start)return null;
  try{return JSON.parse(value.slice(start,end+1))}catch{return null}
}

function onlineAiFood(x){
  if(!x||!x.name)return null;
  const kcal=Number(x.kcal),protein=Number(x.protein),carbs=Number(x.carbs),fat=Number(x.fat);
  if(!Number.isFinite(kcal)||kcal<0||kcal>1000)return null;
  if(!Number.isFinite(protein)||protein<0||protein>100)return null;
  if(!Number.isFinite(carbs)||carbs<0||carbs>100)return null;
  if(!Number.isFinite(fat)||fat<0||fat>100)return null;
  return {id:`ai-online:${norm(x.name).replace(/ /g,'-')}`,source:'ai',aiProvider:'Vireonix',verified:0,name:String(x.name).slice(0,120),kcal,protein,carbs,fat,aiOnline:true};
}

async function getOnlineAiFood(query,seq){
  const q=String(query||'').trim();
  if(q.length<2)return null;
  const key=norm(q);
  if(onlineAiCache.has(key))return onlineAiCache.get(key);
  if(onlineAiAbort)onlineAiAbort.abort();
  onlineAiAbort=new AbortController();
  const timer=setTimeout(()=>onlineAiAbort?.abort(),3000);
  try{
    const prompt=[
      'You are a food search assistant for a Swedish calorie tracker.',
      'Identify the food or drink the user is searching for.',
      'Give a realistic estimate of nutrition per 100 g for the most common interpretation.',
      'If the query is a branded product, preserve the brand name when possible.',
      'Return ONLY JSON: {"name":"...","kcal":0,"protein":0,"carbs":0,"fat":0}.',
      'kcal is kcal per 100 g. protein, carbs and fat are grams per 100 g.',
      'Never claim the values are verified database values.',
      `Search query: ${q}`
    ].join('\n');
    const r=await fetch('https://vireonix.ai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal:onlineAiAbort.signal,
      body:JSON.stringify({model:'auto',temperature:0.1,max_tokens:160,messages:[
        {role:'system',content:'Return compact JSON only. No markdown.'},
        {role:'user',content:prompt}
      ]})
    });
    if(!r.ok)throw new Error(`AI ${r.status}`);
    const data=await r.json();
    if(seq!==onlineAiSequence)return null;
    const food=onlineAiFood(onlineAiJson(data?.choices?.[0]?.message?.content||''));
    if(food)onlineAiCache.set(key,food);
    return food;
  }catch(e){
    if(e?.name!=='AbortError')console.debug('Online AI unavailable',e);
    return null;
  }finally{clearTimeout(timer)}
}

const databaseSearchAll=searchAll;
searchAll=async function(q=''){
  const seq=++onlineAiSequence;
  if(String(q).trim().length<2){if(onlineAiAbort)onlineAiAbort.abort();return databaseSearchAll(q)}
  $('#searchHint').textContent='🧠 Online AI + databaser…';
  const aiPromise=getOnlineAiFood(q,seq);
  const dbPromise=databaseSearchAll(q);
  let ai=null;
  try{ai=await aiPromise}catch{}
  try{await dbPromise}catch{}
  if(seq!==onlineAiSequence)return;
  if(!ai)return;

  const r=$('#results');
  if(!r)return;

  const existing=[...r.querySelectorAll('.result')];
  const aiButton=document.createElement('button');
  aiButton.type='button';
  aiButton.className='result online-ai-result';
  aiButton.innerHTML=`<div class="result-top"><strong>${esc(ai.name)}</strong><span class="source-badge source-ai">AI</span></div><small>${fmt(ai.kcal)} kcal · ${fmt1(ai.protein)} g protein / 100 g · AI-estimat · online</small>`;
  aiButton.onclick=()=>selectFood(ai);
  r.prepend(aiButton);
  $('#searchHint').textContent=`🧠 Online AI-förslag · ${existing.length} databasresultat`;
};
'''
          p.write_text(s.replace(marker, code + marker), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Add free online AI as first search result'
          git rm .github/workflows/rehault-search.yml
          git commit -m 'Remove temporary search workflow'
          git push