name: Rehaul search engine
on: [push]
permissions:
  contents: write
jobs:
  rehaul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          s=p.read_text(encoding='utf-8')
          if 'ONLINE AI SEARCH LAYER V2' in s:
              print('already patched')
              raise SystemExit(0)
          s += r'''

/* =========================================================
   ONLINE AI SEARCH LAYER V2
   Gratis nät-AI först. Databasen och lokal AI finns kvar.
========================================================= */
const onlineAiCache=new Map();
let onlineAiAbort=null;
let onlineAiSeq=0;
function onlineAiParse(text){
  const raw=String(text||'').trim();
  const m=raw.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  const v=m?m[1]:raw;
  const a=v.indexOf('{'),b=v.lastIndexOf('}');
  if(a<0||b<=a)return null;
  try{return JSON.parse(v.slice(a,b+1))}catch{return null}
}
function onlineAiNormalize(x){
  if(!x||!x.name)return null;
  const kcal=Number(x.kcal),protein=Number(x.protein),carbs=Number(x.carbs),fat=Number(x.fat);
  if(!Number.isFinite(kcal)||kcal<0||kcal>1000)return null;
  if(!Number.isFinite(protein)||protein<0||protein>100)return null;
  if(!Number.isFinite(carbs)||carbs<0||carbs>100)return null;
  if(!Number.isFinite(fat)||fat<0||fat>100)return null;
  return {id:`ai-online:${norm(x.name).replace(/ /g,'-')}`,source:'ai',aiProvider:'Vireonix',verified:0,name:String(x.name).slice(0,120),kcal,protein,carbs,fat,aiOnline:true};
}
async function onlineAiFood(query,seq){
  const q=String(query||'').trim();
  if(q.length<2)return null;
  const key=norm(q);
  if(onlineAiCache.has(key))return onlineAiCache.get(key);
  if(onlineAiAbort)onlineAiAbort.abort();
  onlineAiAbort=new AbortController();
  const timer=setTimeout(()=>onlineAiAbort?.abort(),3000);
  try{
    const prompt=`You are the nutrition search assistant in a Swedish calorie tracker. Identify the food or drink in this search and estimate nutrition per 100 g for the most common interpretation. If it is a branded product, keep the brand. Return ONLY JSON with exactly: name,kcal,protein,carbs,fat. kcal is kcal per 100 g; the others are grams per 100 g. Never claim verified database values. Search: ${q}`;
    const r=await fetch('https://vireonix.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},signal:onlineAiAbort.signal,body:JSON.stringify({model:'auto',temperature:0.1,max_tokens:160,messages:[{role:'system',content:'Return compact JSON only. No markdown.'},{role:'user',content:prompt}]})});
    if(!r.ok)throw new Error(`AI ${r.status}`);
    const d=await r.json();
    if(seq!==onlineAiSeq)return null;
    const food=onlineAiNormalize(onlineAiParse(d?.choices?.[0]?.message?.content||''));
    if(food)onlineAiCache.set(key,food);
    return food;
  }catch(e){
    if(e?.name!=='AbortError')console.debug('Online AI unavailable',e);
    return null;
  }finally{clearTimeout(timer)}
}
const databaseSearchAllV2=searchAll;
searchAll=async function(q=''){
  const seq=++onlineAiSeq;
  if(String(q).trim().length<2){if(onlineAiAbort)onlineAiAbort.abort();return databaseSearchAllV2(q)}
  $('#searchHint').textContent='🧠 Online AI + databaser…';
  const aiPromise=onlineAiFood(q,seq);
  const dbPromise=databaseSearchAllV2(q);
  let ai=null;
  try{ai=await aiPromise}catch{}
  try{await dbPromise}catch{}
  if(seq!==onlineAiSeq||!ai)return;
  const r=$('#results');
  if(!r)return;
  const old=[...r.querySelectorAll('.result')];
  const b=document.createElement('button');
  b.type='button';b.className='result online-ai-result';
  b.innerHTML=`<div class="result-top"><strong>${esc(ai.name)}</strong><span class="source-badge source-ai">AI</span></div><small>${fmt(ai.kcal)} kcal · ${fmt1(ai.protein)} g protein / 100 g · AI-estimat · online</small>`;
  b.onclick=()=>selectFood(ai);
  r.prepend(b);
  $('#searchHint').textContent=`🧠 Online AI-förslag · ${old.length} databasresultat`;
};
'''
          p.write_text(s,encoding='utf-8')
          PY
          python3 /tmp/patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Add free online AI as first food search result' || true
          git rm .github/workflows/rehault-search.yml || true
          git commit -m 'Remove temporary search workflow' || true
          git push