name: Rehaul search engine

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rehaul:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch app.js
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Add free online AI as first food search result'
          git rm .github/workflows/rehault-search.yml
          git rm .search-rehaul-trigger
          git commit -m 'Remove temporary search workflow'
          git push